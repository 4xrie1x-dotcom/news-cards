name: 매일 카드뉴스 자동 발행

on:
  schedule:
    # 한국시간(KST, UTC+9) 22:00 = UTC 13:00
    - cron: "0 13 * * *"
  workflow_dispatch: {} # 테스트용 수동 실행

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: main.py 실행 (기사 수집·요약·카드 생성)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py

      - name: 결과물 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # output/ 또는 logs/ 중 하나가 비어있거나 없어도(극단적 실패 케이스) 전체가
          # 죽지 않도록 각각 개별적으로 실패를 허용한다
          git add output/ || echo "output/ 커밋 대상 없음"
          git add logs/ || echo "logs/ 커밋 대상 없음"
          if git diff --staged --quiet; then
            echo "커밋할 변경 사항이 없습니다."
          else
            git commit -m "자동 발행: $(TZ='Asia/Seoul' date +'%Y-%m-%d') 카드뉴스"
            git push
          fi
